name: Daily Portfolio Update

on:
  schedule:
    # Runs Monday through Friday at 21:00 UTC (4:00 PM EST / Market Close)
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Allows manual one-click run anytime

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run portfolio script
        run: python app.py  # Check: Change app.py if your uploaded Python file has a different name!

      - name: Commit & push updated chart image
        run: |
          git config --global user.name "GitHub Automation"
          git config --global user.email "actions@github.com"
          git add latest_portfolio_chart.png
          git commit -m "Auto-update portfolio chart [skip ci]" || exit 0
          git push
