name: Daily Portfolio Update

on:
  schedule:
    # Runs Monday through Friday at 21:00 UTC (4:00 PM EST / Market Close)
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Allows manual one-click run anytime

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run portfolio script
        run: python Portfolio.py  # <-- Make sure 'portfolio.py' matches your exact python file name on GitHub!

      - name: Commit & push updated chart image
        run: |
          git config --global user.name "GitHub Automation"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "Auto-update portfolio chart [skip ci]" || exit 0
          git push
